releaseNotes: |
  # CatChat · Actualización de Voz y Transcripción
  
  ## ✨ Novedades Destacadas
  - [NUEVO] **Dictado híbrido en tiempo real**  
    La entrada por voz ahora usa la API nativa `webkitSpeechRecognition` para transcripción instantánea mientras hablas. Si esta API no está disponible (por ejemplo en Electron), CatChat cambia automáticamente a un modelo **Whisper AI local** (`@huggingface/transformers`) como respaldo completamente offline.  
    *Resultado:* dictado fluido, sin depender de servicios externos y sin interrupciones.
  - [MEJORA] **Experiencia de voz simplificada**  
    Desaparecen los banners, visualizaciones de onda y ventanas emergentes. La transcripción se vuelca directamente en el campo de chat y el sistema gestiona el motor más adecuado sin que tengas que configurar nada.
  
  [!TIP]  
  Puedes dictar en cualquier momento; CatChat selecciona silenciosamente el mejor motor de reconocimiento (Web Speech o Whisper local) sin pedirte permisos adicionales ni mostrar alertas.
  
  ## 🐛 Correcciones y Ajustes
  - [FIX] **Bucle infinito de errores de red en Chrome**  
    Cuando la API de reconocimiento de voz era bloqueada, el sistema entraba en un ciclo de reintentos que saturaba la consola. Ahora el dictado se fragmenta en segmentos cortos no‑continuos y se reinicia automáticamente de forma controlada.
  - [FIX] **Error 500 en APIs STT externas**  
    Se implementaron rutas alternativas y se añadieron instrucciones amigables para usar APIs gratuitas de Groq/HuggingFace como última opción, evitando fallos catastróficos.
  - [FIX] **Contención del micrófono (`getUserMedia`)**  
    Se eliminó la competencia entre la captura de audio y el reconocimiento de voz, lo que provocaba fallos intermitentes en el dictado.
  - [FIX] **Limpieza de logs repetitivos**  
    Los errores de red de `SpeechRecognition` ya no llenan la consola con mensajes redundantes, facilitando la depuración.
  
  ## ⚡ Rendimiento y Optimización
  - [MEJORA] **Menor latencia y menor consumo de red**  
    Al priorizar la API nativa del navegador y usar Whisper solo como respaldo, se evitan llamadas a servidores externos, reduciendo la latencia y el uso de datos.
  - [MEJORA] **Transcripción 100% offline en Electron**  
    El modelo Whisper Tiny se carga localmente mediante HuggingFace Transformers, permitiendo dictado incluso sin conexión a internet.
  
  ## 🎨 UI & Experiencia de Usuario
  - [DISEÑO] **Flujo de dictado directo**  
    El audio se convierte en texto en el mismo campo de entrada del chat, sin elementos visuales intermedios. La voz se transforma en palabras al instante.
  - [DISEÑO] **Notas de voz integradas**  
    La funcionalidad de «Voice Notes» se fusiona de forma minimalista con la transcripción en vivo: hablas y tu texto aparece listo para enviar.
