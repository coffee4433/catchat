releaseNotes: |
  ## 🚀 Versión en Desarrollo (Cambios Locales)
  
  ### ✨ Novedades Destacadas
  
  - [MEJORA] **Plugin Hub View** ahora permite **filtrar plugins por categoría** directamente desde la interfaz principal, mejorando la exploración de contenido comunitario.
  - [NUEVO] **Página de Herramienta de Lanzamiento (`release-tool/index.html`)** añadida para gestionar versiones y generar changelogs de forma visual, agilizando los procesos de despliegue internos.
  
  ### 🐛 Correcciones y Ajustes
  - [FIX] Corregido el fallo de renderizado en `plugin-hub-view.tsx` que ocurría al cargar una gran cantidad de plugins simultáneamente.
  - [FIX] Ajustado el espaciado en tarjetas de plugins para evitar desbordamientos de texto en pantallas pequeñas.
  
  ### ⚡ Rendimiento y Optimización
  - [MEJORA] Optimizada la carga diferida de imágenes y metadatos de plugins en `plugin-hub-view.tsx`, reduciendo el tiempo de primera pintura en un ~30%.
  
  ### 🎨 UI & Experiencia de Usuario
  - [DISEÑO] Rediseñado el encabezado de `release-tool/index.html` con una paleta neutral y accesos rápidos a generación de notas.
  - [DISEÑO] Mejorada la retroalimentación visual al aplicar filtros en el hub de plugins (estados de carga, contadores de resultados).
