releaseNotes: |
  ## ✨ Novedades Destacadas
  
  > [!NOTE]  
  > ¡El plugin **CatMusic v0.0.6** ya está disponible! Trae la reproducción de música directamente a los canales de voz de CatChat con comandos slash, controles avanzados y un panel interactivo.
  
  - [NUEVO] **Comandos Slash (`/play`, `/skip`, `/pause`, `/queue`, `/nowplaying`)** para gestionar la música sin recordar prefijos.
  - [NUEVO] **Soporte para YouTube y SoundCloud** como fuentes de audio, con búsqueda automática de canciones.
  - [NUEVO] **Sistema de cola inteligente** con capacidad de añadir, eliminar y reordenar canciones desde un menú desplegable.
  - [NUEVO] **Panel de reproducción interactivo** que muestra la portada, título, artista y barra de progreso en tiempo real.
  - [NUEVO] **Control de volumen por usuario** (`/volume`) para ajustar la experiencia a tu gusto sin afectar a los demás.
  - [NUEVO] **Modo DJ** configurable por rol, restringiendo los comandos de control a moderadores o roles asignados.
  
  ## 🎨 UI & Experiencia de Usuario
  
  - [DISEÑO] Los mensajes de estado de reproducción ahora se actualizan automáticamente, mostrando el progreso de la canción y reacciones para control rápido (▶️, ⏸️, ⏭️).
  - [DISEÑO] Integración con **emojis personalizados de CatChat** para los botones del reproductor, manteniendo la identidad visual del ecosistema.
  
  ## ⚡ Rendimiento y Optimización
  
  - [MEJORA] La conexión al canal de voz se reanuda automáticamente tras desconexiones breves, evitando interrupciones inesperadas.
  - [MEJORA] Caché de búsquedas recientes para reducir el tiempo de respuesta al repetir canciones.
