releaseNotes: |
  ## ✨ Novedades Destacadas
  
  - [MEJORA] **Restauración del módulo cat-music:** se ha recuperado la funcionalidad de los módulos de música, que estaban ausentes en la versión anterior.  
  - [DISEÑO] **Logo oficial implementado:** la barra de título, la pantalla de bienvenida y el icono del instalador ahora muestran el nuevo logotipo `catchat.png`.
  
  ## 🐛 Correcciones y Ajustes
  
  - [FIX] **Sincronización al eliminar complementos:** se resolvió un fallo en CatChat Hub que impedía que la eliminación de un complemento se reflejara correctamente en todos los clientes conectados.
  
  ## ⚡ Rendimiento y Optimización
  
  - [MEJORA] **Calidad del código:** se limpiaron advertencias del linter, mejorando la mantenibilidad y evitando posibles errores silenciosos.
  
  ## 🎨 UI & Experiencia de Usuario
  
  > [!NOTE]  
  > A partir de esta versión, el logo oficial de CatChat se ha integrado en los puntos de contacto clave: barra de título, pantalla de carga (splash) e instalador. La experiencia visual ahora es más consistente y profesional.
