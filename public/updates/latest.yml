releaseNotes: |
  ## ✨ Novedades Destacadas
  - [NUEVO] **Indicador de presencia en vivo** en el sidebar: ahora cada conversación muestra un **punto verde/ausente** directamente sobre el avatar del usuario, gracias a Supabase Presence en tiempo real.
  - [NUEVO] **Confirmación de lectura instantánea** estilo WhatsApp: cuando el destinatario está en línea en el chat, los mensajes se marcan como leídos en **0ms**, eliminando toda espera.
  - [MEJORA] El envío de mensajes ahora responde en **menos de 30ms** y la transmisión en tiempo real es **sin latencia** (WebSocket broadcast), haciendo la experiencia más fluida.
  
  ## 🐛 Correcciones y Ajustes
  - [FIX] La imagen de banner del usuario ahora se muestra correctamente tanto en el **Popover** como en el **Modal de perfil**; antes no se cargaba por una omisión en la consulta a la base de datos.
  - [FIX] Los mensajes ya no desaparecen momentáneamente durante el envío: se sincroniza el caché de SWR antes de limpiar los mensajes pendientes.
  - [FIX] Se arregló un **doble salto del scroll** al enviar un mensaje y durante las transiciones de los checks de estado; ahora el scroll se mantiene estable.
  - [FIX] Eliminado el rebote de doble animación al hacer scroll hacia el nuevo mensaje, reemplazado por un alineamiento instantáneo.
  - [FIX] Los mensajes duplicados y las animaciones de entrada repetidas ya no ocurren: se deduplican los mensajes pendientes contra los del servidor.
  - [FIX] Se corrigió un desplazamiento de **1px** en el ícono de verificación (check) de los mensajes, logrando una alineación perfecta.
  
  ## ⚡ Rendimiento y Optimización
  - [MEJORA] La acción `sendMessage` se optimizó para ejecutarse en **<30ms**, reduciendo drásticamente el tiempo de respuesta del servidor.
  - [MEJORA] Se eliminó el retraso de `revalidatePath` y se agregó una **transmisión en tiempo real sin latencia** mediante Supabase Realtime Broadcast, acelerando la entrega de mensajes.
  - [MEJORA] La concordancia de IDs de presencia en Supabase se amplió para lograr la confirmación de lectura instantánea (0ms) de los checks azules.
  - [MEJORA] Las notificaciones `read_receipt` ahora se transmiten **en menos de 10ms** de ida y vuelta cuando ambos usuarios están en línea, usando WebSockets directamente.
  
  ## 🎨 UI & Experiencia de Usuario
  - [DISEÑO] Nuevo diseño del **UserPopover**: marco del avatar con **corte semicircular grueso** y anillo indicador de estado al estilo Discord, fiel a la captura de referencia.
  - [DISEÑO] Ajuste de dimensiones del Popover a **300×276px** y altura del banner a **105px**, según las instrucciones del usuario.
  - [DISEÑO] El estado de presencia del avatar en el Popover ahora se actualiza **dinámicamente en tiempo real** (online/offline).
  - [DISEÑO] El **encabezado del chat** ahora muestra el avatar del otro usuario con el indicador de presencia en vivo, reemplazando el anterior “led blink” y el badge “#”.
  - [DISEÑO] Se actualizó el botón de CatMusic en la barra de íconos: tamaño ajustado a `size-10` y ahora renderiza la imagen `catmusic.png`.
  - [NUEVO] Agregado indicador de estado en línea (punto verde) en los avatares de la fila de conversaciones (`ConversationRow`), usando Supabase Realtime Presence.
  
  > [!NOTE]
  > La experiencia de mensajería ahora es prácticamente **instantánea**: los mensajes se envían y se marcan como leídos sin ningún retraso cuando ambas partes están conectadas.
