releaseNotes: |
  ## ✨ Novedades Destacadas
  - [MEJORA] La carga de archivos de gran tamaño (hasta 230 MB) ahora utiliza streaming nativo y reintentos automáticos para una mayor estabilidad.
  
  ## 🐛 Correcciones y Ajustes
  - [FIX] **Carga de archivos grandes**: Solucionado un problema que impedía la subida de archivos binarios de gran tamaño (ej. 230 MB). Ahora se usa streaming nativo HTTPS con 3 reintentos automáticos en caso de fallo.
  - [FIX] **Solicitudes de amistad en tiempo real**: Ahora, cuando aceptas una solicitud de amistad, el remitente ve la actualización instantáneamente sin necesidad de recargar la página.
  
  > [!TIP]  
  > Ahora puedes subir archivos adjuntos de gran tamaño con total confianza: el sistema reintentará la carga hasta 3 veces si hay problemas de red.
  
  ## ⚡ Rendimiento y Optimización
  - La carga de archivos pesados utiliza streaming para reducir el consumo de memoria y mejorar la velocidad.
  
  ## 🎨 UI & Experiencia de Usuario
  - La lista de amigos se actualiza en tiempo real al aceptar solicitudes, mejorando la fluidez de la interacción.
