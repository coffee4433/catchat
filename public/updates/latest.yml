releaseNotes: |
  ## ✨ Novedades Destacadas
  
  > [!NOTE]
  > ¡Llega el **Survivor Shooter**! Un nuevo mini‑juego de supervivencia con oleadas de enemigos, potenciadores y tabla de clasificación. ¡Pon a prueba tus reflejos!
  
  - [NUEVO] **Plugin Survivor Shooter** – Acción arcade directamente en CatChat.
    - Soporte completo como plugin oficial: instalación, configuración y ejecución desde el `Hub de Plugins`.
    - Sistema de puntuación, vidas y niveles progresivos.
    - Efectos visuales y de sonido inmersivos (si el servidor lo permite).
  - [MEJORA] **Plugin Hub** – Ahora muestra la nueva categoría “Juegos” e incluye acceso rápido a Survivor Shooter.
  - [MEJORA] **Polimarket** – Actualización menor en la vista principal para mejor compatibilidad con el nuevo sistema de plugins.
  
  ## 🐛 Correcciones y Ajustes
  
  - [FIX] Se resolvió un error que impedía cargar plugins con dependencias personalizadas en el `Plugin Provider`.
  - [FIX] Corregida la ruta de recursos en `pnpm-lock.yaml` tras añadir las nuevas librerías del juego.
  
  ## ⚡ Rendimiento y Optimización
  
  - [MEJORA] **Carga de plugins** optimizada: el motor de plugins ahora precarga metadatos sin afectar el renderizado inicial.
  - [MEJORA] **Memoria** – Survivor Shooter libera correctamente los recursos gráficos al cerrarse, evitando fugas en sesiones largas.
  
  ## 🎨 UI & Experiencia de Usuario
  
  - [DISEÑO] **Hub de Plugins** – Mejoras visuales en las tarjetas de juegos, con insignias de “Nuevo” y miniatura dinámica.
  - [DISEÑO] **Survivor Shooter** – Interfaz de juego integrada nativamente con el tema de CatChat (modo claro/oscuro adaptable).
  - [DISEÑO] **Transiciones** – Animaciones suaves al abrir/cerrar el plugin desde el hub.
