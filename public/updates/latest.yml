releaseNotes: |
  ## ✨ Novedades Destacadas
  
  [NUEVO] **Gestión integrada de GitHub Releases y Plugins** desde la herramienta de lanzamiento. Búsqueda en tiempo real, tarjetas redondeadas y soporte completo de eliminación.  
  
  [NUEVO] **Botón de actualización de plugins** y **banner visual de actualización del dock** para mantener todo al día sin salir de la app.
  
  > [!NOTE]  
  > Ahora puedes administrar releases y plugins de GitHub directamente desde la release‑tool, con una experiencia de búsqueda ágil y visual.
  
  ---
  
  ## 🐛 Correcciones y Ajustes
  
  [FIX] **Desplazamiento suave y barra de búsqueda flotante centrada** en la release‑tool, garantizando una navegación consistente y sin saltos.
  
  ---
  
  ## ⚡ Rendimiento y Optimización
  
  [MEJORA] **Renderizado de la ventana splash** mejorado:  
  - Logo en **PNG de 500×500** para máxima calidad.  
  - **Aceleración por hardware** activada para arranques más rápidos.  
  - Contraste ultra nítido que asegura una presentación impecable en cualquier pantalla.
  
  ---
  
  ## 🎨 UI & Experiencia de Usuario
  
  [DISEÑO] **Nueva barra de búsqueda flotante** en la release‑tool, con diseño tipo *command palette* inspirado en **Raycast**.  
  
  [DISEÑO] **Icono oficial de CatChat** integrado en:  
  - Barra de título de la ventana principal  
  - Pantalla splash  
  - Instalador NSIS  
  
  [DISEÑO] **Banner de actualización del dock** con interfaz unificada y moderna.
