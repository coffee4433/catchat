releaseNotes: |
  ## ✨ Novedades Destacadas
  
  - [NUEVO] **Nuevos logotipos oficiales** de CatChat y CatMusic integrados con activos PNG, reemplazando las imágenes anteriores.
  - [MEJORA] **PluginHubView ahora se adapta a pantallas grandes**: la cuadrícula llega hasta 4 columnas, con cartas más amplias y sin truncar el título del plugin en ningún ancho.
  - [NUEVO] **Localización dinámica (i18n)** en las descripciones de los plugins – ahora se traducen automáticamente según el idioma de la app.
  - [MEJORA] Rediseño completo del **panel de plugins**:
    - Eliminados el hero text, badge, subtítulo y encabezado para una vista limpia y centrada en el contenido.
    - Corregido el prefijo de la badge de versión y eliminados los datos falsos de descargas y el enlace al código fuente.
    - Aplicados los tokens de tema de la app para una integración visual coherente.
  
  ## 🎨 UI & Experiencia de Usuario
  
  - [DISEÑO] **Barra lateral (IconRail)**:
    - Eliminado el borde derecho de 1px para un aspecto más limpio.
    - Sustituido el icono del logo por un texto limpio «**CatChat**» en el encabezado.
  - [DISEÑO] **Botones de logotipo** en la barra lateral y PluginHubView:
    - Eliminados el borde blanco y el anillo de foco (`ring-offset`).
    - Esquinas rectas (`rounded-none`) y luego ajustadas a **`rounded-2xl`** para coincidir exactamente con las esquinas “squircle” de las imágenes PNG.
    - Eliminadas las dobles líneas y el padding interior; ahora el logo ocupa el **100% del botón**, completamente al ras.
    - Aumentado el tamaño de los contenedores a `size-11`, `size-12` y `size-full`, utilizando `object-cover` y `scale-135` para que el gráfico llene todo el espacio de esquina a esquina.
  - [DISEÑO] **Otras mejoras visuales**:
    - Eliminados los efectos de hover en motion sobre el logo de CatMusic, ahora con renderizado PNG transparente y más profesional.
    - Iconos de estado cambiados a Cloud y HardDrive para mayor claridad.
    - PluginHubView ahora llena el 100% del ancho y alto dentro del modal de ajustes, sin dobles barras de desplazamiento ni rellenos molestos.
  
  ## 🐛 Correcciones y Ajustes
  
  - [FIX] **PluginHubView** ya no muestra scroll doble ni padding interno en el modal de configuración.
  - [FIX] Los plugins ahora respetan correctamente los tokens de diseño de la aplicación, garantizando colores, espacios y tipografía coherentes.
  - [FIX] Se eliminaron elementos incorrectos (descargas ficticias, enlace a código fuente) y se corrigió el prefijo del badge de versión.
