releaseNotes: |
  ## ✨ Novedades Destacadas
  
  - [NUEVO] **Reinicio automático de la sesión de IA** al publicar una nueva versión de CatChat. La conversación se limpia para que empieces con un contexto fresco.  
  - [NUEVO] Se añadió un **botón manual “Nueva Sesión”** para que puedas reiniciar la charla cuando quieras, sin esperar a una actualización.
  
  ## 🐛 Correcciones y Ajustes
  
  - [FIX] Las **notas de la versión** ahora muestran **exclusivamente los cambios de la versión actual**. Se han corregido la extracción de commits y la limpieza automática de notas antiguas, evitando que se acumule información de lanzamientos previos.  
  - [FIX] Eliminado el botón redundante “Open modal” del encabezado de Ajustes > Notas de la versión, dejando una interfaz más limpia.
  
  ## 🎨 UI & Experiencia de Usuario
  
  - [DISEÑO] Encabezado de notas de la versión en Ajustes simplificado al retirar el botón modal que no se usaba.
