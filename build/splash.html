<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #fafafa;
      --muted: rgba(255, 255, 255, 0.5);
      --border-subtle: rgba(255, 255, 255, 0.07);
    }

    html {
      background: var(--bg);
    }

    body {
      position: fixed;
      inset: 0;
      margin: 0;
      background: #0d0d0d;
      color: var(--fg);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      border-radius: 16px;
      box-sizing: border-box;
      isolation: isolate;
      -webkit-app-region: drag;
    }

    /* Full-page aurora mesh */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 30% 20%, rgba(139,92,246,0.12) 0%, transparent 55%),
        radial-gradient(ellipse at 70% 60%, rgba(6,182,212,0.1) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 80%, rgba(236,72,153,0.08) 0%, transparent 55%),
        radial-gradient(ellipse at 20% 50%, rgba(255,255,255,0.03) 0%, transparent 40%);
      animation: body-aurora 8s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes body-aurora {
      0%, 100% { transform: scale(1) translate(0, 0); }
      33% { transform: scale(1.05) translate(10px, -8px); }
      66% { transform: scale(1.03) translate(-6px, 6px); }
    }

    /* Full-page shimmer particles */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 15% 25%, rgba(139,92,246,0.5), transparent),
        radial-gradient(1px 1px at 55% 18%, rgba(6,182,212,0.45), transparent),
        radial-gradient(1.5px 1.5px at 75% 45%, rgba(236,72,153,0.4), transparent),
        radial-gradient(1px 1px at 30% 65%, rgba(255,255,255,0.4), transparent),
        radial-gradient(1.5px 1.5px at 85% 75%, rgba(139,92,246,0.35), transparent),
        radial-gradient(1px 1px at 45% 85%, rgba(6,182,212,0.4), transparent),
        radial-gradient(1.5px 1.5px at 10% 55%, rgba(236,72,153,0.35), transparent),
        radial-gradient(1px 1px at 65% 35%, rgba(255,255,255,0.35), transparent);
      background-size: 300% 300%;
      animation: body-shimmer 6s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes body-shimmer {
      0%, 100% { background-position: 0% 0%; }
      25% { background-position: 100% 0%; }
      50% { background-position: 100% 100%; }
      75% { background-position: 0% 100%; }
    }

    .ambient {
      position: fixed;
      inset: 0;
      border-radius: 16px;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* Gusanos de borde — solo en el perímetro interior (sin halo exterior) */
    .magic-border-layer {
      position: fixed;
      inset: 0;
      border-radius: 16px;
      overflow: hidden;
      pointer-events: none;
      z-index: 100;
      contain: paint;
    }

    .magic-border-mask {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      padding: 1px;
      overflow: hidden;
    }

    .magic-beams {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 300vh;
      height: 300vh;
      transform: translate(-50%, -50%);
      background: conic-gradient(
        from 0deg,
        transparent 0%, transparent 15%, rgba(139,92,246,0.12) 20%, rgba(139,92,246,0.3) 22%, rgba(255,255,255,0.5) 23.5%, rgba(139,92,246,0.12) 25%,
        transparent 25%, transparent 40%, rgba(6,182,212,0.1) 45%, rgba(6,182,212,0.25) 47%, rgba(255,255,255,0.4) 48.5%, rgba(6,182,212,0.1) 50%,
        transparent 50%, transparent 65%, rgba(236,72,153,0.1) 70%, rgba(236,72,153,0.25) 72%, rgba(255,255,255,0.4) 73.5%, rgba(236,72,153,0.1) 75%,
        transparent 75%, transparent 90%, rgba(139,92,246,0.1) 95%, rgba(139,92,246,0.25) 97%, rgba(255,255,255,0.4) 98.5%, rgba(139,92,246,0.1) 100%
      );
      animation: magic-spin 10s linear infinite;
      opacity: 0.7;
    }

    @keyframes magic-spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .content-wrapper {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-container {
      margin-bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .logo-glow {
      position: absolute;
      width: 140px;
      height: 140px;
      object-fit: contain;
      filter: blur(20px) saturate(1.3) brightness(1.6);
      opacity: 0.9;
      transform: scale(1.06);
      z-index: 1;
      pointer-events: none;
      animation: glow-breathe 3s ease-in-out infinite;
    }

    @keyframes glow-breathe {
      0%, 100% {
        opacity: 0.7;
        transform: scale(1.05);
      }
      50% {
        opacity: 1;
        transform: scale(1.12);
      }
    }

    .logo {
      width: 140px;
      height: 140px;
      object-fit: contain;
      position: relative;
      z-index: 2;
    }

    .logo-fallback {
      display: none;
      width: 140px;
      height: 140px;
      border-radius: 24px;
      background: #171717;
      border: 1px solid var(--border-subtle);
      align-items: center;
      justify-content: center;
      font-size: 52px;
      color: var(--fg);
      font-weight: 700;
      box-shadow: 0 24px 56px rgba(0, 0, 0, 0.45);
      position: relative;
      z-index: 2;
    }

    .title {
      font-size: 15px;
      font-weight: 600;
      color: var(--fg);
      letter-spacing: -0.02em;
    }
  
    canvas.particles-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}


</style>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="particles" id="particles"></div>
  </div>

  <!-- Gusanos en el único borde de la ventana -->
  <div class="magic-border-layer" aria-hidden="true">
    <div class="magic-border-mask">
      <div class="magic-beams"></div>
    </div>
  </div>

  <div class="content-wrapper">
    <div class="logo-container">
      <img
        class="logo-glow"
        src="./cat-chat-logo.png"
        alt=""
        aria-hidden="true"
      >
      <img
        class="logo"
        src="./cat-chat-logo.png"
        alt="CatChat Logo"
        onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='flex'"
      >
      <div class="logo-fallback" id="logo-fallback">CC</div>
    </div>
  </div>

<script>
(function(){
const container=document.getElementById('particles');
const canvas=document.createElement('canvas');
canvas.className='particles-canvas';
container.appendChild(canvas);
const ctx=canvas.getContext('2d');

let dots=[];
const COUNT=50;

function resize(){
  canvas.width=innerWidth;
  canvas.height=innerHeight;
}
resize();
addEventListener('resize',resize);

for(let i=0;i<COUNT;i++){
  dots.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    r:Math.random()*1.5+0.5,
    vx:(Math.random()-0.5)*0.3,
    vy:(Math.random()-0.5)*0.3,
    o:Math.random()*0.5+0.3,
    pulse:Math.random()*Math.PI*2,
  });
}

// Shooting stars
let stars=[];
function spawnStar(){
  const angle=Math.random()*Math.PI*2;
  const speed=2+Math.random()*3;
  const cx=canvas.width/2;
  const cy=canvas.height/2;
  const radius=Math.max(canvas.width,canvas.height)*0.7;
  stars.push({
    x:cx+Math.cos(angle)*radius,
    y:cy+Math.sin(angle)*radius,
    vx:-Math.cos(angle)*speed,
    vy:-Math.sin(angle)*speed,
    life:1,
    decay:0.008+Math.random()*0.012,
    len:80+Math.random()*120,
  });
}
setInterval(spawnStar,2500);
spawnStar();

function draw(t){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Shooting stars
  for(let i=stars.length-1;i>=0;i--){
    const s=stars[i];
    s.x+=s.vx;
    s.y+=s.vy;
    s.life-=s.decay;
    if(s.life<=0){stars.splice(i,1);continue;}
    const angle=Math.atan2(s.vy,s.vx);
    const ex=s.x-Math.cos(angle)*s.len;
    const ey=s.y-Math.sin(angle)*s.len;
    const grad=ctx.createLinearGradient(s.x,s.y,ex,ey);
    grad.addColorStop(0,`rgba(255,255,255,${s.life})`);
    grad.addColorStop(1,'rgba(255,255,255,0)');
    ctx.beginPath();
    ctx.moveTo(s.x,s.y);
    ctx.lineTo(ex,ey);
    ctx.strokeStyle=grad;
    ctx.lineWidth=1.2;
    ctx.stroke();
  }

  // particles
  for(let d of dots){
    d.x+=d.vx;
    d.y+=d.vy;
    if(d.x<0)d.x=canvas.width;
    if(d.x>canvas.width)d.x=0;
    if(d.y<0)d.y=canvas.height;
    if(d.y>canvas.height)d.y=0;
    d.pulse+=0.015;
    const alpha=d.o+Math.sin(d.pulse)*0.2;
    ctx.beginPath();
    ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${alpha})`;
    ctx.fill();
  }

  // connections
  for(let i=0;i<dots.length;i++){
    for(let j=i+1;j<dots.length;j++){
      const dx=dots[i].x-dots[j].x;
      const dy=dots[i].y-dots[j].y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<100){
        ctx.beginPath();
        ctx.moveTo(dots[i].x,dots[i].y);
        ctx.lineTo(dots[j].x,dots[j].y);
        ctx.strokeStyle=`rgba(255,255,255,${0.04*(1-dist/100)})`;
        ctx.lineWidth=0.5;
        ctx.stroke();
      }
    }
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
})();
</script></body>
</html>
