<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #fafafa;
      --muted: rgba(255, 255, 255, 0.5);
      --border-subtle: rgba(255, 255, 255, 0.07);
      --glow-amber: rgba(245, 158, 11, 0.18);
      --grid-size: 30px;
      --worm-track: 150px;
      --border-worm: #f59e0b;
      --border-worm-trans: rgba(245, 158, 11, 0.28);
    }

    html {
      background: var(--bg);
    }

    body {
      position: fixed;
      inset: 0;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      border-radius: 16px;
      box-sizing: border-box;
      isolation: isolate;
    }

    .ambient {
      position: fixed;
      inset: 0;
      border-radius: 16px;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    /* Rejilla estática + gusanos de luz en bucle por las líneas */
    .grid-wrap {
      position: absolute;
      inset: 0;
      overflow: hidden;
      -webkit-mask-image: radial-gradient(95% 95% at 50% 50%, #000 0%, transparent 100%);
      mask-image: radial-gradient(95% 95% at 50% 50%, #000 0%, transparent 100%);
    }

    .grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px),
        linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px);
      background-size: var(--grid-size) var(--grid-size);
    }

    .grid-worms {
      position: absolute;
      inset: 0;
      pointer-events: none;
      filter: blur(0.6px);
    }

    /* Gusanos horizontales — solo visibles sobre líneas H de la rejilla */
    .grid-worms-h {
      background-image: repeating-linear-gradient(
        90deg,
        transparent 0px,
        transparent 20px,
        rgba(245, 158, 11, 0.12) 26px,
        rgba(255, 255, 255, 0.65) 34px,
        rgba(245, 158, 11, 0.18) 42px,
        transparent 50px,
        transparent var(--worm-track)
      );
      background-size: var(--worm-track) var(--grid-size);
      -webkit-mask-image: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent calc(var(--grid-size) - 1px),
        #000 calc(var(--grid-size) - 1px),
        #000 var(--grid-size)
      );
      mask-image: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent calc(var(--grid-size) - 1px),
        #000 calc(var(--grid-size) - 1px),
        #000 var(--grid-size)
      );
      animation: worms-h 2.6s linear infinite;
    }

    .grid-worms-h-2 {
      background-image: repeating-linear-gradient(
        90deg,
        transparent 0px,
        transparent 55px,
        rgba(255, 255, 255, 0.08) 62px,
        rgba(245, 158, 11, 0.35) 72px,
        rgba(255, 255, 255, 0.08) 82px,
        transparent 90px,
        transparent var(--worm-track)
      );
      animation: worms-h-rev 3.4s linear infinite;
      opacity: 0.75;
    }

    /* Gusanos verticales — solo visibles sobre líneas V de la rejilla */
    .grid-worms-v {
      background-image: repeating-linear-gradient(
        0deg,
        transparent 0px,
        transparent 20px,
        rgba(245, 158, 11, 0.12) 26px,
        rgba(255, 255, 255, 0.65) 34px,
        rgba(245, 158, 11, 0.18) 42px,
        transparent 50px,
        transparent var(--worm-track)
      );
      background-size: var(--grid-size) var(--worm-track);
      -webkit-mask-image: repeating-linear-gradient(
        to right,
        transparent 0,
        transparent calc(var(--grid-size) - 1px),
        #000 calc(var(--grid-size) - 1px),
        #000 var(--grid-size)
      );
      mask-image: repeating-linear-gradient(
        to right,
        transparent 0,
        transparent calc(var(--grid-size) - 1px),
        #000 calc(var(--grid-size) - 1px),
        #000 var(--grid-size)
      );
      animation: worms-v 2.9s linear infinite;
    }

    .grid-worms-v-2 {
      background-image: repeating-linear-gradient(
        0deg,
        transparent 0px,
        transparent 48px,
        rgba(255, 255, 255, 0.08) 56px,
        rgba(245, 158, 11, 0.35) 66px,
        rgba(255, 255, 255, 0.08) 76px,
        transparent 84px,
        transparent var(--worm-track)
      );
      animation: worms-v-rev 3.1s linear infinite;
      opacity: 0.75;
    }

    @keyframes worms-h {
      from { background-position: 0 0; }
      to { background-position: var(--worm-track) 0; }
    }

    @keyframes worms-h-rev {
      from { background-position: var(--worm-track) 0; }
      to { background-position: 0 0; }
    }

    @keyframes worms-v {
      from { background-position: 0 0; }
      to { background-position: 0 var(--worm-track); }
    }

    @keyframes worms-v-rev {
      from { background-position: 0 var(--worm-track); }
      to { background-position: 0 0; }
    }

    .glow-orb {
      position: absolute;
      top: 28%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 260px;
      height: 260px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 50%;
      filter: blur(80px);
    }

    .glow-orb-amber {
      position: absolute;
      bottom: 8%;
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 70px;
      background: var(--glow-amber);
      border-radius: 50%;
      filter: blur(36px);
      opacity: 0.55;
    }

    /* Gusanos de borde — solo en el perímetro interior (sin halo exterior) */
    .magic-border-layer {
      position: fixed;
      inset: 0;
      border-radius: 16px;
      overflow: hidden;
      pointer-events: none;
      z-index: 100;
      contain: paint;
    }

    .magic-border-mask {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      padding: 1px;
      overflow: hidden;
    }

    .magic-beams {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 300vh;
      height: 300vh;
      transform: translate(-50%, -50%);
      background: conic-gradient(
        from 0deg,
        transparent 0%, transparent 7%, var(--border-worm-trans) 13%, var(--border-worm) 15.5%, #ffffff 16.66%,
        transparent 16.66%, transparent 23.66%, var(--border-worm-trans) 29.66%, var(--border-worm) 32.16%, #ffffff 33.33%,
        transparent 33.33%, transparent 40.33%, var(--border-worm-trans) 46.33%, var(--border-worm) 48.83%, #ffffff 50%,
        transparent 50%, transparent 57%, var(--border-worm-trans) 63%, var(--border-worm) 65.5%, #ffffff 66.66%,
        transparent 66.66%, transparent 73.66%, var(--border-worm-trans) 79.66%, var(--border-worm) 82.16%, #ffffff 83.33%,
        transparent 83.33%, transparent 90.33%, var(--border-worm-trans) 96.33%, var(--border-worm) 98.83%, #ffffff 100%
      );
      animation: magic-spin 5s linear infinite;
    }

    @keyframes magic-spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .content-wrapper {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fade-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo-container {
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo {
      width: 96px;
      height: 96px;
      object-fit: contain;
      border-radius: 20px;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.1),
        0 16px 40px rgba(0, 0, 0, 0.45);
    }

    .logo-fallback {
      display: none;
      width: 96px;
      height: 96px;
      border-radius: 20px;
      background: #171717;
      border: 1px solid var(--border-subtle);
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: var(--fg);
      font-weight: 700;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }

    .title {
      font-size: 15px;
      font-weight: 600;
      color: var(--fg);
      letter-spacing: -0.02em;
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="grid-wrap">
      <div class="grid-bg"></div>
      <div class="grid-worms grid-worms-h"></div>
      <div class="grid-worms grid-worms-h grid-worms-h-2"></div>
      <div class="grid-worms grid-worms-v"></div>
      <div class="grid-worms grid-worms-v grid-worms-v-2"></div>
    </div>
    <div class="glow-orb"></div>
    <div class="glow-orb-amber"></div>
  </div>

  <!-- Gusanos en el único borde de la ventana -->
  <div class="magic-border-layer" aria-hidden="true">
    <div class="magic-border-mask">
      <div class="magic-beams"></div>
    </div>
  </div>

  <div class="content-wrapper">
    <div class="logo-container">
      <img
        class="logo"
        src="./icon.png"
        alt="CatChat Logo"
        onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='flex'"
      >
      <div class="logo-fallback" id="logo-fallback">CC</div>
    </div>
    <div class="title">CatChat</div>
  </div>
</body>
</html>
